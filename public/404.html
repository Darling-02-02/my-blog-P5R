<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>灵敏度加满的blog</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    var pathPrefix = '/my-blog-P5R';
    var l = window.location;
    var appPath = l.pathname.indexOf(pathPrefix) === 0
      ? l.pathname.slice(pathPrefix.length)
      : l.pathname;
    var redirectPath = appPath.replace(/^\/?/, '/');
    var redirectSearch = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      pathPrefix + '/?' + redirectPath.replace(/&/g, '~and~') +
      redirectSearch +
      l.hash
    );
  </script>
</head>
<body>
  <noscript>
    <h1>请启用 JavaScript 以查看此网站</h1>
    <p>这是一个 React 单页应用，需要 JavaScript 支持。</p>
  </noscript>
</body>
</html>
