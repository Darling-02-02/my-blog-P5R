name: ci-debug (temporary)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Capture tcb behaviour
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          exec > /tmp/dbg.log 2>&1
          set +e
          echo "node=$(node -v)"
          echo "cli=$(npm ls -g @cloudbase/cli --depth=0 2>/dev/null | tail -1)"
          echo "cwd=$(pwd)"
          echo "CI=$CI  HOME=$HOME  TERM=${TERM:-unset}"
          echo "keylen=${#CLOUDBASE_API_KEY}  envlen=${#TCB_ENV_ID}"
          echo "isatty_stdin=$(node -e 'process.stdout.write(String(process.stdin.isTTY))')"
          echo "=== attempt 1: tcb login -y (timeout 60, stdin=/dev/null) ==="
          timeout 60 tcb login -y --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$TCB_ENV_ID" </dev/null 2>&1
          echo "exit=$?"
          echo "=== attempt 2: tcb login without -y (timeout 60, stdin=/dev/null) ==="
          timeout 60 tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$TCB_ENV_ID" </dev/null 2>&1
          echo "exit=$?"
          echo "=== credential locations (names only) ==="
          find "$HOME" "$PWD" -maxdepth 5 \( -iname '*cloudbase*' -o -iname '*credential*' \) 2>/dev/null | head -30
          echo "=== attempt 3: tcb env list (timeout 45) ==="
          timeout 45 tcb env list -e "$TCB_ENV_ID" </dev/null 2>&1 | head -20
          echo "exit=$?"

          mkdir -p .ci-debug
          cp /tmp/dbg.log .ci-debug/login.log
          git config user.name "ci-debug"
          git config user.email "ci-debug@local"
          git add -f .ci-debug/login.log
          git commit -m "ci-debug: capture tcb login behaviour"
          git push -f origin HEAD:ci-debug
          echo "push exit=$?"
