name: Build and deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      # 环境级 API Key：只对该环境有效，可在控制台/CLI 单独吊销
      # （tcb env apikey create <name> -e <envId> / tcb env apikey delete <keyId>）
      # -y 不能省：登录成功后 CLI 会就「是否同意收集使用数据」弹确认框，
      # 而该确认只认 -y/--yes 或 CLOUDBASE_CI=1，在无 TTY 的 runner 上会一直等下去
      - name: Login to CloudBase
        run: tcb login -y --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$TCB_ENV_ID"
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}

      - name: Deploy to static hosting
        run: tcb hosting deploy -y ./dist / -e "$TCB_ENV_ID"
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
