name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Node 22 而不是 20：scripts/validate-content.mjs 和 scripts/*.test.mjs 直接 import
      # src/lib/*.ts（Node 22 起默认支持类型剥离）。Node 20 会在 Validate content 这一步
      # 以 ERR_UNKNOWN_FILE_EXTENSION 挂掉——2026-10-11 run #141 就是这么失败的（Build/Deploy 全被跳过）。
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # 放在最前面：Secret 缺失时 5 秒内报错，不必先跑完 install + build。
      # （空 token 传给 wrangler 会得到一句难懂的认证错误，不如自己先拦住。）
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，请在 Settings → Secrets and variables → Actions 添加（做法见 pipeline/cloudflare-pages-deployment.md）"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # 内容坏了不许上线：2026-10-10 那次「空 tags: 的文章」就是这么把线上打挂的
      # （src/data/articles.ts 在模块初始化时解析所有 Markdown，抛错即整站白屏）。
      # 校验放在 build 之前，坏内容直接拦在 CI。
      - name: Validate content
        run: npm run validate:content

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # 产物目录（pages_build_output_dir）和 KV 绑定都写在仓库根目录的 wrangler.toml 里，这里不再传位置参数。
        run: npx --yes wrangler@4 pages deploy --project-name=my-blog-p5r --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
